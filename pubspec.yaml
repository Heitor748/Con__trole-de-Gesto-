name: controle_de_lenha_trbj
description: Controle de Lenha TRBJ - Gerenciamento de notas de lenha com OCR e relatórios.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase backend
  supabase_flutter: ^2.3.4

  # OCR / ML Kit
  google_mlkit_text_recognition: ^0.11.0

  # Camera & image
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7

  # HTTP
  http: ^1.2.1

  # Google AI (Gemini)
  google_generative_ai: ^0.4.3

  # Google Sign-In & APIs
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0

  # PDF generation & printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Storage / file system
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  flutter_dotenv: ^5.1.0
  permission_handler: ^11.3.0
  path: ^1.9.0

  # UI
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/service_account.json
    - .env
